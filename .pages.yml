      - Thrinia
      - Timi
      - Tombs of the Kings
      - Trachypedoula
      - Tremithousa
      - Tsada
      - Universal
    description: Shown on the listing and used by the Area filter.
  - name: condition
    label: Condition
    type: select
    options:
      values:
      - Resale
      - Key ready
      - Under construction
      - Off plan
      - Completed
      - Incomplete
  - name: furnished
    label: Furnished
    type: select
    options:
      values:
      - Fully furnished
      - Partially furnished
      - Unfurnished
      - Optional furnished
  - name: zoning
    label: Land zoning
    type: select
    options:
      values:
      - Residential
      - Commercial
      - Touristic
      - Agricultural
      - Industrial
    description: Land only.
  - name: title
    label: Headline
    type: string
    required: true
    description: Short and factual, e.g. 3 bed villa with private pool
  - name: price
    label: Price (€)
    type: number
    required: true
    description: Numbers only.
  - name: plus_vat
    label: VAT added on top
    type: boolean
    default: false
  - name: bedrooms
    label: Bedrooms
    type: number
  - name: bathrooms
    label: Bathrooms
    type: number
  - name: covered_m2
    label: Covered area (m²)
    type: number
  - name: plot_m2
    label: Plot (m²)
    type: number
  - name: veranda_m2
    label: Covered veranda (m²)
    type: number
  - name: floor
    label: Floor
    type: string
    description: e.g. Ground, 2, Top
  - name: toilets
    label: Extra toilets (WC)
    type: number
  - name: parking_spaces
    label: Parking spaces
    type: number
  - name: title_deed
    label: Title deed
    type: select
    description: Required for sales.
    options:
      values:
      - name: issued
        label: Issued
      - name: after-completion
        label: After completion
      - name: pending
        label: Pending
  - name: energy_class
    label: Energy class
    type: select
    description: From the Energy Performance Certificate. Required for buildings, not land.
    options:
      values:
      - A
      - B
      - C
      - D
      - E
      - F
      - G
      - exempt
  - name: distance_to_sea_km
    label: Distance to sea (km)
    type: number
  - name: distance_to_airport_km
    label: Distance to airport (km)
    type: number
  - name: distance_to_schools_km
    label: Distance to schools (km)
    type: number
  - name: distance_to_amenities_km
    label: Distance to shops (km)
    type: number
  - name: year_built
    label: Year built
    type: number
  - name: common_fees_month
    label: Communal fees (€ a month)
    type: number
  - name: features
    label: Features
    type: string
    description: Separate with | e.g. Sea view|Private pool|Solar panels
  - name: description
    label: Description
    type: text
    required: true
  - name: photos
    label: Photos
    type: image
    description: First photo is the main one. Landscape, at least 1600 px wide.
    options:
      media: photos
      multiple:
        max: 20
  - name: photo_caption
    label: Main photo shows
    type: string
  - name: photo_rights_confirmed
    label: Agent confirms we may use these photos
    type: boolean
    default: false
  - name: latitude
    label: Latitude
    type: number
    description: From Google Maps. Approximate is fine; the site shows an area circle.
  - name: longitude
    label: Longitude
    type: number
  - name: source_url
    label: Imported from
    type: string
    readonly: true
    description: The page this draft was built from. Check every field against it.
  - name: imported_on
    label: Imported on
    type: string
    hidden: true
  - name: date_listed
    label: Date listed
    type: date
  - name: last_confirmed
    label: Agent last confirmed available
    type: date
- name: agents
  label: Agents
  type: collection
  path: content/agents
  format: json
  filename: '{fields.id}.json'
  view:
    fields:
    - name
    - office
    - licence_no
    primary: name
  fields:
  - name: id
    label: Short code
    type: string
    required: true
    description: Lower case, no spaces, e.g. sunrise-estates
  - name: name
    label: Agency name
    type: string
    required: true
  - name: office
    label: Main office
    type: string
    required: true
  - name: since
    label: Year started
    type: number
  - name: registration_no
    label: Registration no.
    type: string
    required: true
  - name: licence_no
    label: Licence no.
    type: string
    required: true
  - name: licence_checked_on
    label: Licence checked on (Shel)
    type: date
  - name: phone
    label: Phone
    type: string
    required: true
  - name: about
    label: About
    type: text
- name: news
  label: News
  type: collection
  path: content/news
  format: yaml-frontmatter
  filename: '{year}-{month}-{day}-{primary}.md'
  view:
    fields:
    - title
    - date
    primary: title
    sort:
    - date
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Headline
    type: string
    required: true
  - name: date
    label: Date
    type: date
    required: true
  - name: summary
    label: Short summary (shown on the home page)
    type: text
  - name: image
    label: Picture
    type: image
    options:
      media: photos
  - name: published
    label: Show on website
    type: boolean
    default: true
  - name: body
    label: Article
    type: rich-text
