# Netlify builds the site itself, so changes saved in the website editor (Pages CMS) go live without anyone running a build.
# Editor saves carry [skip netlify] so each save doesn't use a deploy; the editor's "Publish website" button
# (.github/workflows/publish.yml) makes one deploy with everything saved so far.
[build]
  publish = "out"
  command = "python3 build.py"

[build.environment]
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Private previews (pull requests) also show hidden drafts, so they can be checked before anyone ticks "Show on website".
[context.deploy-preview]
  command = "SHOW_DRAFTS=1 python3 build.py"
