# Website editor (Pages CMS, app.pagescms.org). Saving commits here with [skip netlify]; the Publish button makes one Netlify deploy.
media:
- name: photos
  label: Property photos
  input: content/photos
  output: /content/photos
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  rename: true
settings:
  commit:
    templates:
      create: Add {path} [skip netlify]
      update: Update {path} [skip netlify]
      delete: Delete {path} [skip netlify]
      rename: Rename {oldPath} to {newPath} [skip netlify]
actions:
- name: publish
  label: Publish website
  workflow: publish.yml
  confirm:
    title: Publish all saved changes to the website?
    button: Publish
content:
- name: listings
  label: Properties
  type: collection
  path: content/listings
  format: json
  filename: '{fields.ref}.json'
  actions:
  - name: import-url
    label: Import from a link
    workflow: import-url.yml
    scope: collection
    confirm:
      title: Build a draft property from this page?
      button: Import
    fields:
    - name: url
      label: Link to the property page
      type: text
      required: true
    - name: agent_id
      label: Agent short code (e.g. sunrise-estates)
      type: text
    - name: ref
      label: Reference (leave blank to make one)
      type: text
  view:
    fields:
    - ref
    - title
    - area
    - price
    - published
    primary: title
    sort:
    - ref
    - price
  fields:
  - name: published
    label: Show on website
    type: boolean
    default: true
    description: Untick to take the home off the site without deleting it.
  - name: featured
    label: Show in "Selected properties" on the home page
    type: boolean
    default: false
  - name: ref
    label: Reference
    type: string
    required: true
    description: Your own reference number, e.g. 20001. Can't be changed later.
  - name: agent_id
    label: Agent
    type: reference
    required: true
    options:
      collection: agents
      value: '{id}'
      label: '{name}'
  - name: purpose
    label: Section
    type: select
    required: true
    options:
      values:
      - name: resale
        label: 'For sale: resale'
      - name: new-build
        label: 'For sale: new build'
      - name: land
        label: 'For sale: land'
  - name: area
    label: Area (town page)
    type: select
    required: true
    options:
      values:
      - name: kato-paphos
        label: Kato Paphos
      - name: paphos-town
        label: Paphos town
      - name: chloraka
        label: Chloraka
      - name: kissonerga
        label: Kissonerga
      - name: coral-bay
        label: Coral Bay
      - name: peyia
        label: Peyia
      - name: tala
        label: Tala
      - name: emba
        label: Emba
      - name: geroskipou
        label: Geroskipou
      - name: polis
        label: Polis
      - name: latchi
        label: Latchi
    description: The nearest of our town/area pages. The village goes in "Village / neighbourhood".
  - name: type
    label: Property type
    type: select
    options:
      values:
      - House
      - Apartment
      - Land
      - Office
      - Shop/Showroom
      - Building
      - Mixed use building
      - Warehouse/Factory
      - Project
      - Restaurant
    required: true
  - name: subtype
    label: Sub-type
    type: select
    options:
      values:
      - Detached
      - Semi-detached
      - Townhouse
      - Maisonette
      - Bungalow
      - Villa
      - Studio
      - Ground floor
      - Whole floor
      - Top floor/penthouse
      - Duplex
      - Plot
      - Field
      - Development land
      - Whole floor
      - Residential
      - Commercial
    description: Optional. Pick one that matches the property type.
  - name: locality
    label: Village / neighbourhood
    type: select
    options:
      values:
      - Acheleia
      - Agia Marina Chrysochous
      - Agia Marina Kelokedaron
      - Agia Marinouda
      - Agia Varvara
      - Agios Dimitrianos
      - Agios Georgios
      - Agios Isidoros
      - Agios Theodoros
      - Akamas
      - Akourdaleia
      - Akoursos
      - Amargeti
      - Anarita
      - Anavargos
      - Androlikou
      - Aphrodite Hills
      - Archimandrita
      - Argaka
      - Arminou
      - Armou
      - Arodes
      - Asprogia
      - Axylou
      - Chlorakas
      - Choletria
      - Choli
      - Choulou
      - Chrysochou
      - Coral Bay
      - Drousia
      - Drymou
      - Emba
      - Episkopi
      - Evretou
      - Filousa
      - Fyti
      - Galataria
      - Geroskipou
      - Geroskipou Tourist Area
      - Gialia
      - Giolou
      - Goudi
      - Ineia
      - Kallepia
      - Kamares
      - Kannaviou
      - Kathikas
      - Kato Paphos
      - Kedares
      - Kelokedara
      - Kidasi
      - Kili
      - Kissonerga
      - Koili
      - Koloni
      - Konia
      - Kouklia
      - Kritou Marottou
      - Kritou Tera
      - Kynousa
      - Lasa
      - Latchi
      - Lemona
      - Lempa
      - Letymvou
      - Limni
      - Lysos
      - Makounta
      - Mamonia
      - Mandria
      - Marathounta
      - Meladeia
      - Mesa Chorio
      - Mesana
      - Mesogi
      - Milia
      - Miliou
      - Moutallos
      - Nata
      - Neo Chorio
      - Nikokleia
      - Pano Panagia
      - Paphos town
      - Pelathousa
      - Pentalia
      - Peristerona
      - Peyia
      - Polemi
      - Polis
      - Pomos
      - Praitori
      - Prastio
      - Prodromi
      - Psathi
      - Salamiou
      - Sea Caves
      - Secret Valley
      - Simou
      - Skoulli
      - Souskiou
      - Statos-Agios Fotios
      - Steni
